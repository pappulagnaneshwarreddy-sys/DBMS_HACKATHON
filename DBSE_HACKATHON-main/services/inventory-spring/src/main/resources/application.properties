spring.application.name=relieflink-inventory-service
server.port=8081

# PostgreSQL Connection
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:relieflink_db}
spring.datasource.username=${POSTGRES_USER:relieflink_admin}
spring.datasource.password=${POSTGRES_PASSWORD:relieflink_dev_password_change_in_prod}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Internal Security
relieflink.internal.mesh-key=${INTERNAL_SERVICE_KEY:relieflink_internal_mesh_token_2026}

# Management & Health
management.endpoints.web.exposure.include=health,info
